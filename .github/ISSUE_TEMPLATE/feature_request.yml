name: ✨ Feature Request
description: 새 기능 / 개선 제안
title: "feat(<scope>): "
labels: ["type/feat"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제 / 배경
      description: 왜 필요한가요? 지금 무엇이 불편한가요?
      placeholder: 예) 링크로 받은 프로젝트에 참여하려면 로그인부터 해야 해서 친구들이 중간에 나감
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
      description: 다른 방법과 고르지 않은 이유
      placeholder: 예) 이름만 받아 저장 vs Supabase 익명 로그인
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: 선택한 해결 방향
      placeholder: |
        - 로그인 없이 참여하면 익명 계정을 만든다
        - 나중에 카카오·Apple로 로그인하면 같은 계정에 이어 붙인다
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 검증 기준
      placeholder: |
        - [ ] 로그인 없이 링크에서 바로 참여된다
        - [ ] 로그인한 뒤에도 참여 기록이 남는다
        - [ ] /preview 케이스가 있다
    validations:
      required: true
