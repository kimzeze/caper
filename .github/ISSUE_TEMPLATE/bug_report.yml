name: 🐛 Bug Report
description: 버그 신고 / 예상과 다르게 동작하는 부분
title: "fix(<scope>): "
labels: ["type/bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 무엇이 문제인가요
      description: 한 줄 요약과 어떤 화면에서 생겼는지
      placeholder:
        예) 프로젝트 페이지에서 제목이 길면 포스터 아래로 넘쳐 부제를 가림
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 단계
      placeholder: |
        1. 제목이 40자 넘는 프로젝트를 만든다
        2. 390px 폭에서 프로젝트 페이지를 연다
        3. 제목이 부제와 겹친다
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 예상 동작
      placeholder: 제목이 줄바꿈되고 부제는 제목 아래에 놓여야 함
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: 브라우저, OS, 화면 크기, 라이트·다크
      placeholder: |
        - Browser: Safari 26
        - OS: iOS 26
        - 화면: 390px, 다크
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 스크린샷 / 로그
    validations:
      required: false
